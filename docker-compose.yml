# One command, identical result on Windows/macOS/any Linux distro:
#   docker compose up --build
# Then open http://localhost:3000 on this machine, or http://<this-machine's-LAN-IP>:3000
# from a phone/tablet on the same Wi-Fi — see docs/running-on-your-devices.md
# for how to find that IP on each OS and how to install it as an app on Android.
services:
  the-manual:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'file:./dev.db'
      # Signs session cookies for multi-user auth — required, no safe default.
      # Set it in a repo-root .env (docker compose reads it automatically;
      # see docs/running-on-your-devices.md): `openssl rand -base64 32`.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in a repo-root .env, see docs/running-on-your-devices.md}
    volumes:
      # Named volume so the SQLite file (and your progress) survives
      # `docker compose down` / image rebuilds. First run seeds it from the
      # image's prisma/ directory (schema.prisma + a freshly-pushed dev.db).
      # /repo/app, not /app — the Dockerfile's runtime WORKDIR as of the
      # two-fork monorepo rework (npm workspaces root at /repo), see
      # app/Dockerfile and MASTERFILE.md §3.6.5.
      - manual_data:/repo/app/prisma
    restart: unless-stopped

volumes:
  manual_data:
